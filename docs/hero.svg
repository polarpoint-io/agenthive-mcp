<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <radialGradient id="centreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#0f2238"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" opacity="0.8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" opacity="0.8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="640" cy="310" rx="320" ry="200" fill="url(#centreGlow)"/>

  <!-- ─── LEFT: IDE session card ───────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="32" y="188" width="204" height="256" rx="10" fill="url(#cardGrad)" stroke="#21262d" stroke-width="1.5"/>
  </g>
  <circle cx="134" cy="236" r="20" fill="#1f2937" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="134" y="242" text-anchor="middle" font-size="14" fill="#a78bfa">&gt;_</text>
  <text x="134" y="273" text-anchor="middle" font-size="12" fill="#e6edf3">Coding session</text>
  <text x="134" y="289" text-anchor="middle" font-size="10" fill="#8b949e">payments-api repo</text>
  <line x1="52" y1="304" x2="216" y2="304" stroke="#21262d" stroke-width="1"/>
  <rect x="52" y="314" width="130" height="7" rx="3" fill="#21262d"/>
  <rect x="52" y="328" width="100" height="7" rx="3" fill="#21262d"/>
  <rect x="52" y="342" width="118" height="7" rx="3" fill="#21262d"/>
  <rect x="52" y="356" width="88" height="7" rx="3" fill="#21262d"/>
  <rect x="52" y="370" width="108" height="7" rx="3" fill="#1a1f27"/>
  <rect x="52" y="384" width="76" height="7" rx="3" fill="#1a1f27"/>
  <rect x="52" y="398" width="120" height="7" rx="3" fill="#1a1f27"/>
  <text x="134" y="462" text-anchor="middle" font-size="10" fill="#6e7681" letter-spacing="0.8">AGENT SESSION</text>

  <line x1="238" y1="316" x2="300" y2="316" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <!-- ─── LEFT-CENTRE: the IDE ─────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="300" y="248" width="148" height="136" rx="10" fill="url(#cardGrad)" stroke="#21262d" stroke-width="1.5"/>
  </g>
  <circle cx="374" cy="297" r="24" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
  <path d="M 364 292 L 374 286 L 384 292 L 384 304 L 364 304 Z" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linejoin="round"/>
  <text x="374" y="333" text-anchor="middle" font-size="12" fill="#e6edf3">Your IDE</text>
  <text x="374" y="349" text-anchor="middle" font-size="9" fill="#8b949e">Cursor · Claude Code</text>
  <text x="374" y="370" text-anchor="middle" font-size="8" fill="#4b5563">spawns over stdio</text>

  <line x1="450" y1="316" x2="500" y2="316" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="475" y="308" text-anchor="middle" font-size="9" fill="#3b82f6">MCP</text>

  <!-- ─── CENTRE: MCP server card ──────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="500" y="88" width="304" height="468" rx="12" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>
  <!-- Badge -->
  <rect x="572" y="104" width="160" height="20" rx="10" fill="#1e40af" fill-opacity="0.6"/>
  <text x="652" y="118" text-anchor="middle" font-size="9" fill="#93c5fd" letter-spacing="1">MCP SERVER · MEMBER-SCOPED</text>
  <!-- Title -->
  <text x="652" y="154" text-anchor="middle" font-size="17" fill="#e6edf3" font-weight="bold">agenthive-mcp</text>
  <text x="652" y="173" text-anchor="middle" font-size="10" fill="#60a5fa">polarpoint-io / agenthive-mcp</text>
  <line x1="522" y1="188" x2="782" y2="188" stroke="#2d4a7a" stroke-width="1"/>

  <!-- Tools -->
  <rect x="520" y="198" width="264" height="38" rx="6" fill="#0d1f38" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="520" y="198" width="4" height="38" rx="2" fill="#3b82f6"/>
  <text x="536" y="214" font-size="10" fill="#60a5fa" font-weight="bold">retrieve_context</text>
  <text x="536" y="228" font-size="9" fill="#6e7681">Bounded neighborhood of approved memory</text>

  <rect x="520" y="242" width="264" height="38" rx="6" fill="#0d1f38" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="520" y="242" width="4" height="38" rx="2" fill="#10b981"/>
  <text x="536" y="258" font-size="10" fill="#6ee7b7" font-weight="bold">log_session</text>
  <text x="536" y="272" font-size="9" fill="#6e7681">Writes a memory node · starts pending</text>

  <rect x="520" y="286" width="264" height="38" rx="6" fill="#0d1f38" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="520" y="286" width="4" height="38" rx="2" fill="#8b5cf6"/>
  <text x="536" y="302" font-size="10" fill="#a78bfa" font-weight="bold">create_agent / list_agents</text>
  <text x="536" y="316" font-size="9" fill="#6e7681">Register or look up an agent identity</text>

  <rect x="520" y="330" width="264" height="38" rx="6" fill="#0d1f38" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="520" y="330" width="4" height="38" rx="2" fill="#f59e0b"/>
  <text x="536" y="346" font-size="10" fill="#fcd34d" font-weight="bold">create_task / list_tasks</text>
  <text x="536" y="360" font-size="9" fill="#6e7681">Register or look up a task to scope to</text>

  <rect x="520" y="374" width="264" height="38" rx="6" fill="#1a0f10" stroke="#5f2020" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="520" y="374" width="4" height="38" rx="2" fill="#6b7280"/>
  <text x="536" y="390" font-size="10" fill="#9ca3af" font-weight="bold">approve / reject / users</text>
  <text x="536" y="404" font-size="9" fill="#6e7681">Admin-only — deliberately not a tool here</text>

  <text x="652" y="432" text-anchor="middle" font-size="9" fill="#4b5563" letter-spacing="0.5">why: an agent shouldn't approve its own memory</text>

  <!-- Transport -->
  <rect x="562" y="498" width="180" height="18" rx="9" fill="#0d1117" fill-opacity="0.7"/>
  <text x="652" y="510" text-anchor="middle" font-size="8" fill="#4b5563" letter-spacing="0.8">STDIO · HTTP/SSE · FastMCP</text>

  <!-- ─── RIGHT: outputs ────────────────────────────────────────── -->
  <line x1="806" y1="250" x2="870" y2="220" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.55" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="806" y1="330" x2="870" y2="368" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.55" marker-end="url(#arrow-green)" stroke-dasharray="4 3"/>

  <!-- AgentHive -->
  <g filter="url(#shadow)">
    <rect x="870" y="132" width="196" height="150" rx="10" fill="url(#cardGrad)" stroke="#21262d" stroke-width="1.5"/>
  </g>
  <circle cx="968" cy="184" r="26" fill="#0d1f38" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M 958 178 L 968 172 L 978 178 L 978 190 L 968 196 L 958 190 Z" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="968" y="222" text-anchor="middle" font-size="12" fill="#e6edf3">AgentHive</text>
  <text x="968" y="238" text-anchor="middle" font-size="10" fill="#8b949e">Team memory API</text>
  <rect x="900" y="252" width="136" height="16" rx="8" fill="#1e40af" fill-opacity="0.4"/>
  <text x="968" y="263" text-anchor="middle" font-size="8" fill="#93c5fd" letter-spacing="0.5">TRAVERSAL, NOT A PROXY</text>

  <!-- Review gate -->
  <g filter="url(#shadow)">
    <rect x="870" y="300" width="196" height="164" rx="10" fill="url(#cardGrad)" stroke="#21262d" stroke-width="1.5"/>
  </g>
  <text x="968" y="324" text-anchor="middle" font-size="11" fill="#8b949e">pending → approved</text>

  <circle cx="900" cy="350" r="14" fill="#161b22" stroke="#10b981" stroke-width="1.2"/>
  <circle cx="900" cy="344" r="5" fill="#e6edf3"/>
  <path d="M 892 358 Q 900 348 908 358" fill="none" stroke="#e6edf3" stroke-width="2"/>
  <text x="920" y="348" font-size="10" fill="#e6edf3">Human review</text>
  <text x="920" y="360" font-size="8" fill="#6e7681">/ui or an admin script</text>

  <circle cx="900" cy="392" r="14" fill="#1a0f10" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="900" y="397" text-anchor="middle" font-size="12" fill="#f59e0b">≈</text>
  <text x="920" y="390" font-size="10" fill="#e6edf3">Auto-approve rules</text>
  <text x="920" y="402" font-size="8" fill="#6e7681">by tag or by agent_id</text>

  <rect x="900" y="432" width="136" height="16" rx="8" fill="#1f3a1f" fill-opacity="0.7"/>
  <text x="968" y="443" text-anchor="middle" font-size="8" fill="#3fb950" letter-spacing="0.5">GATE ENFORCED SERVER-SIDE</text>

  <!-- Deployment badge -->
  <g filter="url(#shadow)">
    <rect x="870" y="480" width="196" height="72" rx="10" fill="url(#cardGrad)" stroke="#21262d" stroke-width="1.5"/>
  </g>
  <circle cx="910" cy="516" r="18" fill="#1f2937" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="902" y="508" width="16" height="12" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
  <line x1="910" y1="520" x2="910" y2="524" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="968" y="509" text-anchor="middle" font-size="11" fill="#e6edf3">Your machine</text>
  <text x="968" y="525" text-anchor="middle" font-size="9" fill="#8b949e">stdio · personal token</text>

  <!-- ─── BOTTOM STRIP ──────────────────────────────────────────── -->
  <rect x="32" y="590" width="1216" height="1" fill="#21262d"/>

  <g transform="translate(40,607)">
    <rect width="100" height="20" rx="10" fill="#1f2937"/>
    <text x="50" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">Python 3.10+</text>
  </g>
  <g transform="translate(148,607)">
    <rect width="80" height="20" rx="10" fill="#1f2937"/>
    <text x="40" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">FastMCP</text>
  </g>
  <g transform="translate(236,607)">
    <rect width="70" height="20" rx="10" fill="#1f2937"/>
    <text x="35" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">mcp SDK</text>
  </g>
  <g transform="translate(314,607)">
    <rect width="110" height="20" rx="10" fill="#1f2937"/>
    <text x="55" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">stdio · HTTP/SSE</text>
  </g>
  <g transform="translate(432,607)">
    <rect width="98" height="20" rx="10" fill="#1f2937"/>
    <text x="49" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">zero dependencies*</text>
  </g>
  <g transform="translate(538,607)">
    <rect width="150" height="20" rx="10" fill="#1f2937"/>
    <text x="75" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">*besides the mcp package</text>
  </g>
  <g transform="translate(976,607)">
    <rect width="80" height="20" rx="10" fill="#0f2238"/>
    <text x="40" y="14" text-anchor="middle" font-size="9" fill="#60a5fa">MIT</text>
  </g>
  <g transform="translate(1064,607)">
    <rect width="146" height="20" rx="10" fill="#0f2238"/>
    <text x="73" y="14" text-anchor="middle" font-size="9" fill="#60a5fa">polarpoint-io</text>
  </g>

</svg>
