[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthive-mcp"
version = "1.0.0"
description = "MCP server exposing AgentHive's shared team memory as native tools for Cursor and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Surj Bains" }]
keywords = ["mcp", "agenthive", "memory", "coding-agents", "platform-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # mcp 2.x renamed mcp.server.fastmcp.FastMCP to MCPServer and changed
    # other APIs (see https://py.sdk.modelcontextprotocol.io/v2/migration/).
    # Pin below 2.0 until this server is migrated; unpinned, CI silently
    # picked up 2.x and every test failed with ModuleNotFoundError.
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/polarpoint-io/agenthive-mcp"
AgentHive = "https://github.com/polarpoint-io/agenthive"

[project.scripts]
agenthive-mcp = "agenthive_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
